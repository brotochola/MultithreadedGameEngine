<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Box2D 3.0 WASM + SAB Workers</title>
	<style>
		body {
			margin: 0;
			font-family: system-ui, sans-serif;
			background: #0f172a;
			color: #e2e8f0;
		}

		main {
			padding: 16px;
		}

		h1 {
			font-size: 1.25rem;
			margin: 0 0 12px;
		}

		.workspace {
			display: flex;
			gap: 16px;
			align-items: flex-start;
		}

		.canvas-stack {
			position: relative;
			width: 960px;
			max-width: min(100vw - 32px, 960px);
		}

		#canvas {
			display: block;
			width: 100%;
			height: auto;
			border: 1px solid #334155;
			background: #111827;
		}

		#overlay {
			position: absolute;
			left: 0;
			top: 0;
			width: 100%;
			height: 100%;
			cursor: crosshair;
			touch-action: none;
		}

		.sidebar {
			min-width: 200px;
			padding: 12px;
			border: 1px solid #334155;
			border-radius: 6px;
			background: #1e293b;
		}

		.sidebar h2 {
			font-size: 0.85rem;
			text-transform: uppercase;
			color: #94a3b8;
			margin: 0 0 8px;
		}

		.sidebar button {
			display: block;
			width: 100%;
			margin-bottom: 8px;
			padding: 8px 12px;
			border: 1px solid #475569;
			border-radius: 4px;
			background: #334155;
			color: #e2e8f0;
			cursor: pointer;
			font-size: 0.95rem;
		}

		.sidebar button:hover {
			background: #475569;
		}

		.sidebar button.active {
			background: #0ea5e9;
			border-color: #38bdf8;
			color: #0f172a;
		}

		.sidebar button.danger {
			border-color: #b91c1c;
		}

		.sidebar button.danger:hover {
			background: #991b1b;
		}

		#ray-result {
			margin-top: 12px;
			font-size: 0.85rem;
			color: #cbd5e1;
			line-height: 1.4;
		}

		#status {
			margin-top: 12px;
			color: #94a3b8;
		}

		#fps {
			margin-top: 8px;
			font-variant-numeric: tabular-nums;
			font-size: 1.1rem;
		}

		#fps span {
			display: inline-block;
			min-width: 10ch;
			margin-right: 1.5rem;
		}

		.sidebar button:disabled {
			opacity: 0.45;
			cursor: not-allowed;
		}

		#overlay.disabled {
			pointer-events: none;
			cursor: default;
			opacity: 0.6;
		}

		.hint {
			font-size: 0.8rem;
			color: #64748b;
			margin: 8px 0 0;
		}
	</style>
</head>
<body>
	<main>
		<h1>Box2D 3.0 — Physics Debug UI</h1>
		<div class="workspace">
			<div class="canvas-stack">
				<canvas id="canvas" width="960" height="540"></canvas>
				<div id="overlay" aria-label="Physics interaction overlay"></div>
			</div>
			<aside class="sidebar">
				<h2>Mode</h2>
				<button type="button" id="mode-box" class="active">Add box (click)</button>
				<button type="button" id="mode-circle">Add circle (click)</button>
				<button type="button" id="mode-ray">Ray cast (drag)</button>
				<h2>Scene</h2>
				<button type="button" id="btn-clear" class="danger">Clear scene</button>
				<p id="ray-result">Ray: —</p>
				<p class="hint">Arena walls stay on clear. Ray shows yellow line + red hit on canvas.</p>
			</aside>
		</div>
		<div id="fps">
			<span>Main: <strong id="fps-main">—</strong> FPS</span>
			<span>Physics: <strong id="fps-physics">—</strong> FPS</span>
			<span>Render: <strong id="fps-render">—</strong> FPS</span>
		</div>
		<div id="status">Loading WASM…</div>
	</main>

	<script src="world-bounds.js"></script>
	<script>
		const statusEl = document.getElementById('status');
		const fpsMainEl = document.getElementById('fps-main');
		const fpsPhysicsEl = document.getElementById('fps-physics');
		const fpsRenderEl = document.getElementById('fps-render');
		const rayResultEl = document.getElementById('ray-result');
		const canvas = document.getElementById('canvas');
		const overlay = document.getElementById('overlay');
		const modeBoxBtn = document.getElementById('mode-box');
		const modeCircleBtn = document.getElementById('mode-circle');
		const modeRayBtn = document.getElementById('mode-ray');
		const clearBtn = document.getElementById('btn-clear');

		const CANVAS_W = 960;
		const CANVAS_H = 540;
		let mode = 'box';
		let renderWorker = null;
		let physicsWorker = null;
		let physicsReady = false;
		let rayDrag = null;

		const sidebarButtons = [
			modeBoxBtn,
			modeCircleBtn,
			modeRayBtn,
			clearBtn,
		];

		function setUiReady(ready) {
			physicsReady = ready;
			overlay.classList.toggle('disabled', !ready);
			for (const btn of sidebarButtons) {
				btn.disabled = !ready;
			}
		}

		setUiReady(false);

		function setMode(next) {
			mode = next;
			modeBoxBtn.classList.toggle('active', mode === 'box');
			modeCircleBtn.classList.toggle('active', mode === 'circle');
			modeRayBtn.classList.toggle('active', mode === 'ray');
		}

		modeBoxBtn.addEventListener('click', () => setMode('box'));
		modeCircleBtn.addEventListener('click', () => setMode('circle'));
		modeRayBtn.addEventListener('click', () => setMode('ray'));

		function overlayScreenCoords(event) {
			const rect = overlay.getBoundingClientRect();
			const sx = ((event.clientX - rect.left) / rect.width) * CANVAS_W;
			const sy = ((event.clientY - rect.top) / rect.height) * CANVAS_H;
			return { sx, sy };
		}

		function screenToWorldPoint(sx, sy) {
			return screenToWorld(sx, sy, CANVAS_W, CANVAS_H);
		}

		function clearRayOverlay() {
			if (renderWorker) {
				renderWorker.postMessage({ type: 'RAY_OVERLAY', visible: false });
			}
			rayResultEl.textContent = 'Ray: —';
		}

		function sendRayOverlay(data) {
			if (!renderWorker) return;
			renderWorker.postMessage({
				type: 'RAY_OVERLAY',
				visible: true,
				ox: data.ox,
				oy: data.oy,
				ex: data.ox + data.dx,
				ey: data.oy + data.dy,
				hit: data.hit,
				px: data.px,
				py: data.py,
				nx: data.nx,
				ny: data.ny,
			});
		}

		function trackMainFps(onFps) {
			let frames = 0;
			let last = performance.now();
			function loop(now) {
				frames++;
				const elapsed = now - last;
				if (elapsed >= 500) {
					onFps(Math.round((frames * 1000) / elapsed));
					frames = 0;
					last = now;
				}
				requestAnimationFrame(loop);
			}
			requestAnimationFrame(loop);
		}

		overlay.addEventListener('pointerdown', (event) => {
			if (!physicsReady || !physicsWorker) return;
			const { sx, sy } = overlayScreenCoords(event);
			const { x, y } = screenToWorldPoint(sx, sy);

			if (mode === 'ray') {
				rayDrag = { ox: x, oy: y, sx, sy };
				overlay.setPointerCapture(event.pointerId);
				return;
			}

			if (mode === 'box') {
				physicsWorker.postMessage({ type: 'CREATE_BOX', x, y });
			} else if (mode === 'circle') {
				for (let i = 0; i < 100; i++) {
					physicsWorker.postMessage({ type: 'CREATE_CIRCLE', x: x + Math.random() * 0.1, y: y + Math.random() * 0.1 });
				}
			}
		});

		overlay.addEventListener('pointerup', (event) => {
			if (!physicsReady || !physicsWorker || mode !== 'ray' || !rayDrag) return;
			const { sx, sy } = overlayScreenCoords(event);
			const end = screenToWorldPoint(sx, sy);
			const dx = end.x - rayDrag.ox;
			const dy = end.y - rayDrag.oy;
			if (Math.hypot(dx, dy) < 0.05) {
				rayDrag = null;
				return;
			}
			physicsWorker.postMessage({
				type: 'CAST_RAY',
				ox: rayDrag.ox,
				oy: rayDrag.oy,
				dx,
				dy,
			});
			rayDrag = null;
			overlay.releasePointerCapture(event.pointerId);
		});

		clearBtn.addEventListener('click', () => {
			if (!physicsReady || !physicsWorker) return;
			clearRayOverlay();
			physicsWorker.postMessage({ type: 'CLEAR_SCENE' });
		});

		function handlePhysicsReply(data) {
			switch (data.type) {
				case 'BODY_CREATED':
					statusEl.textContent = `Created ${data.shapeType === 0 ? 'box' : 'circle'} slot ${data.slot}`;
					if (renderWorker) {
						renderWorker.postMessage({
							type: 'SLOT_HIGH_WATER',
							slot: data.slot,
						});
					}
					break;
				case 'SCENE_CLEARED':
					statusEl.textContent = `Scene cleared (${data.bodyCount} slots, ${data.jointCount} joints high-water)`;
					if (renderWorker) {
						renderWorker.postMessage({
							type: 'SET_SLOT_HIGH_WATER',
							count: 3,
						});
					}
					break;
				case 'RAY_RESULT':
					if (data.hit) {
						rayResultEl.textContent =
							`Ray: hit slot ${data.slot} at (${data.px.toFixed(2)}, ${data.py.toFixed(2)}) t=${data.fraction.toFixed(3)}`;
					} else {
						rayResultEl.textContent = 'Ray: no hit';
					}
					sendRayOverlay(data);
					break;
				case 'ERROR':
					statusEl.textContent = `Error: ${data.message}`;
					break;
				default:
					break;
			}
		}

		if (!crossOriginIsolated) {
			statusEl.innerHTML =
				'<b style="color:#f87171">crossOriginIsolated is false. Serve with node_server.js (COOP/COEP).</b>';
		} else {
			console.log('[main] crossOriginIsolated:', crossOriginIsolated);
			const offscreen = canvas.transferControlToOffscreen();

			trackMainFps((fps) => {
				fpsMainEl.textContent = fps;
			});

			console.log('[main] spawning Worker(box2d_wasm.js)');
			physicsWorker = new Worker('box2d_wasm.js');
			physicsWorker.onmessage = (event) => {
				const data = event.data;
				console.log('[main] physics message:', data.type);
				if (data.type === 'FPS') {
					fpsPhysicsEl.textContent = data.fps;
					return;
				}
				if (data.type === 'READY') {
					renderWorker = new Worker('render.worker.js');
					renderWorker.onmessage = (fpsEvent) => {
						if (fpsEvent.data.type === 'FPS') {
							fpsRenderEl.textContent = fpsEvent.data.fps;
						}
					};
					renderWorker.onerror = (error) => {
						statusEl.textContent = `Render worker error: ${error.message}`;
					};

					renderWorker.postMessage({
						type: 'INIT',
						sab: data.sab,
						bodyCount: data.bodyCount,
						bodyCapacity: data.bodyCapacity,
						channelOffsets: data.channelOffsets,
						metaBaseIndex: data.metaBaseIndex,
						metaStride: data.metaStride,
						jointCount: data.jointCount,
						jointBaseIndex: data.jointBaseIndex,
						jointStride: data.jointStride,
						canvas: offscreen,
					}, [offscreen]);

					statusEl.textContent =
						`Ready — arena only. Click to add bodies or drag to ray cast (${data.bodyCount} slots).`;
					setUiReady(true);
					return;
				}
				handlePhysicsReply(data);
			};

			physicsWorker.onerror = (error) => {
				console.error('[main] physics worker onerror:', error.message, error);
				statusEl.textContent = `Physics worker error: ${error.message}`;
			};
		}
	</script>
</body>
</html>
